[package]
name = "tidewatch-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
dunce = "1.0.5"
encoding_rs = "0.8.44"
imagesize = "0.15.0"
pdf-extract = "0.12.1"
roxmltree = "0.21.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ulid = "3.0.0"
which = "8.0.6"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3.27.0"
